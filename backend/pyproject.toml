[project]
name = "risk-lattice-backend"
version = "0.1.0"
description = "RiskLattice Cross-Asset Macro Contagion Stress-Tester Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "networkx>=3.3",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "litellm>=1.40.0",
    "sse-starlette>=2.1.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
