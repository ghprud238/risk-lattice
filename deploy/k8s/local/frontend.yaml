apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lattice-frontend
  labels:
    app: risk-lattice-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-lattice-frontend
  template:
    metadata:
      labels:
        app: risk-lattice-frontend
    spec:
      containers:
        - name: frontend
          image: risk-lattice-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://risk-lattice-backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: risk-lattice-frontend
spec:
  type: NodePort
  selector:
    app: risk-lattice-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
