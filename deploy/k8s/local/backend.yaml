apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lattice-backend
  namespace: risk-lattice
  labels:
    app: risk-lattice-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-lattice-backend
  template:
    metadata:
      labels:
        app: risk-lattice-backend
    spec:
      containers:
        - name: backend
          image: risk-lattice-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5051
              name: http
          envFrom:
            - configMapRef:
                name: risk-lattice-config
            - secretRef:
                name: risk-lattice-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5051
            initialDelaySeconds: 4
            periodSeconds: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5051
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: risk-lattice-backend
  namespace: risk-lattice
  labels:
    app: risk-lattice-backend
spec:
  type: NodePort
  selector:
    app: risk-lattice-backend
  ports:
    - name: http
      port: 5051
      targetPort: 5051
      nodePort: 30081
