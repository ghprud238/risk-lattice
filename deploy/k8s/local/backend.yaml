apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lattice-backend
  labels:
    app: risk-lattice-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-lattice-backend
  template:
    metadata:
      labels:
        app: risk-lattice-backend
    spec:
      containers:
        - name: backend
          image: risk-lattice-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: risk-lattice-backend
spec:
  type: ClusterIP
  selector:
    app: risk-lattice-backend
  ports:
    - port: 8000
      targetPort: 8000
